# Build the application images from this working tree instead of pulling the
# released ones. An override, not a copy: everything else — ports, volumes,
# environment, healthchecks, the database and Redis — comes from
# `docker-compose.yml`, so the two can never drift apart on the parts that
# matter to how the stack actually runs.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Or, to stop typing both files every time:
#
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml   # or in .env
#   docker compose up -d --build
#
# The build still tags what it produces as the pinned `image:` name from the
# base file, so `docker image ls` shows one version and the running containers
# are unambiguous — a locally built `ahw-core:1.48.0` simply shadows the
# registry's until you pull again.
#
# Only the core is here, because the core is all this repository builds. Every
# transport — including Telegram's — lives in its own repository and is pulled
# as a released image either way; to run one from source, start it on the host
# against this stack (see docs/development/adding-a-transport.md).
services:
  app:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
