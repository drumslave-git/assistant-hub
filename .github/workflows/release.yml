name: Release

# Ships two kinds of artifact, each on its own version field, each gated the
# same way: a "version" that changed on main is a release.
#
#  - The APPS' images, on the ROOT package.json version. Bump it locally
#    (e.g. `npm run release:patch`) and push to main; this workflow verifies,
#    pushes EVERY per-app image (one per entry in the build job's matrix) to the
#    org's GitHub Container Registry (ghcr.io/<owner>/<image>) on that one
#    version, and tags the commit `v<version>`.
#  - The TRANSPORT SDK, on packages/transport-sdk/package.json's version —
#    published to the org's npm registry on GitHub Packages and tagged
#    `transport-sdk-v<version>`. It carries its own semver because a transport
#    author pins the SDK, not a core release, and the two move at different
#    speeds (the wire major they must agree on is `CONTRACT_MAJOR`, which lives
#    in the code, not in either version field).
#
# Auth for both is the job's own GITHUB_TOKEN — no registry secrets to keep.
# No version change -> nothing runs. Manual dispatch (Actions -> Release ->
# Run workflow) forces a release of the CURRENT versions - for re-runs and for
# proving the pipeline on a fresh repo; tagging, image pushes and the npm
# publish are all idempotent.
on:
  push:
    branches: [main]
    # Only wake the workflow when a version file is touched; the version job
    # then confirms a "version" field actually changed before anything ships.
    paths:
      - "package.json"
      - "packages/transport-sdk/package.json"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Detect version changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      sdk_changed: ${{ steps.check.outputs.sdk_changed }}
      sdk_version: ${{ steps.check.outputs.sdk_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Need the previous commit to diff the version fields.
          fetch-depth: 2

      - id: check
        name: Compare each version field against the previous commit
        run: |
          set -eu
          # One rule, applied to each manifest that carries a shippable
          # version: changed on this push (or a manual dispatch) means release.
          check() {
            name="$1" manifest="$2" out="$3"
            current=$(node -p "require('./$manifest').version")
            echo "${out}version=$current" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "$name: manual dispatch -> releasing current version $current."
              echo "${out}changed=true" >> "$GITHUB_OUTPUT"
              return 0
            fi
            if git cat-file -e "HEAD~1:$manifest" 2>/dev/null; then
              previous=$(git show "HEAD~1:$manifest" \
                | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            else
              previous=""
            fi
            echo "$name: previous='$previous' current='$current'"
            if [ "$current" != "$previous" ]; then
              echo "$name: version changed -> release will run."
              echo "${out}changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name: version unchanged -> nothing to release."
              echo "${out}changed=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check "apps" "package.json" ""
          check "transport-sdk" "packages/transport-sdk/package.json" "sdk_"

  verify:
    name: Lint, typecheck, test
    needs: version
    # Whatever is being released, it is verified first — and the whole
    # monorepo is, because the SDK is assembled from the same packages the
    # apps run on.
    if: needs.version.outputs.changed == 'true' || needs.version.outputs.sdk_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # `npm install`, not `npm ci`: package-lock.json is generated on Windows and
      # omits Linux-only optional native deps (@emnapi/*, sharp/lightningcss musl
      # builds), which `npm ci`'s strict sync check rejects. Mirrors the Dockerfile.
      - run: npm install --no-audit --no-fund
      # Root scripts fan out across every workspace via turbo.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Compose is what an operator clones and runs, so its image pins must
      # name the version being released. `npm run release:*` rewrites them;
      # this refuses to ship if someone bumped the version another way.
      - name: Compose pins the released version
        run: node scripts/pin-compose-version.mjs --check

  # A release is all-or-nothing: every image is built first (nothing pushed),
  # and only when EVERY build succeeded does one job push them all and tag the
  # commit. One failing image fails the whole release with the registry and the
  # repo untouched - no half-released version, no dangling tag.
  build:
    name: Build ${{ matrix.image }}
    needs: [version, verify]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Per-app images, all released together on the same version. Every app
      # that ships an image adds a matrix entry here - the publish job picks
      # up whatever this matrix produced.
      matrix:
        include:
          - image: ahw-core
            dockerfile: apps/core/Dockerfile
          - image: ahw-tg
            dockerfile: apps/tg/Dockerfile
      # Let the other image finish (and warm its cache) even if one fails; the
      # publish job still refuses to run unless all of them succeeded.
      fail-fast: false
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Not pushed: exported as a tarball for the publish job.
          outputs: type=docker,dest=/tmp/${{ matrix.image }}.tar
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          # Reuse layers across runs to keep rebuilds fast; scoped per image so
          # the two builds do not evict each other's layers.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.image }}
          path: /tmp/${{ matrix.image }}.tar
          # Only a hand-off to the publish job below; nothing keeps it after.
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish all images and tag
    needs: [version, build]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Required so the workflow can push the release tag back to the repo.
      contents: write
      # Required to push images to the org's container registry.
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true

      - name: Load images
        run: |
          set -eu
          for tar in /tmp/images/*.tar; do
            docker load --input "$tar"
          done
          docker image ls --format '{{.Repository}}:{{.Tag}}'

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every image's version tag goes up before any `latest` moves, so a push
      # failure mid-way can never leave `latest` pointing at a mixed set.
      - name: Push version tags
        run: |
          set -eu
          for ref in $(docker image ls --format '{{.Repository}}:{{.Tag}}' --filter "reference=${REGISTRY}/*:${VERSION}"); do
            docker push "$ref"
          done

      - name: Push latest tags
        run: |
          set -eu
          for ref in $(docker image ls --format '{{.Repository}}:{{.Tag}}' --filter "reference=${REGISTRY}/*:${VERSION}"); do
            latest="${ref%:*}:latest"
            docker tag "$ref" "$latest"
            docker push "$latest"
          done

      # The git tag is the last step: it exists only for a version whose every
      # image is already in the registry.
      - name: Create and push release tag
        run: |
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin, skipping tag creation."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi

  # The transport SDK, on its own version and its own tag. Independent of the
  # images: a transport author installs a package, and pinning it to whatever
  # the core's apps were at would make every app release look like an SDK
  # change. Gated exactly like them — its version field changed on main.
  publish-sdk:
    name: Publish the transport SDK
    needs: [version, verify]
    if: needs.version.outputs.sdk_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Required so the workflow can push the SDK's release tag back to the repo.
      contents: write
      # Required to publish to the org's npm registry on GitHub Packages.
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.sdk_version }}
      PACKAGE: "@assistant-hub-swarm/transport-sdk"
      WORKSPACE: packages/transport-sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          # Writes the auth line for GitHub Packages into ~/.npmrc; the
          # package's own publishConfig already points at that registry.
          registry-url: https://npm.pkg.github.com
          scope: "@assistant-hub-swarm"

      # See the note in `verify` on npm install vs npm ci.
      - run: npm install --no-audit --no-fund

      # Built output (ESM + d.ts), with the four private workspace packages
      # bundled in — see the SDK's tsup config for why nothing published may
      # resolve to a package that exists only in this repo.
      - name: Build
        run: npm run build --workspace $PACKAGE

      # Idempotent, so a re-run or a manual dispatch of an already-published
      # version is a no-op rather than a red workflow.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if npm view "$PACKAGE@$VERSION" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already published, skipping."
            exit 0
          fi
          npm publish --workspace $PACKAGE

      # Last, like the images' tag: it exists only for a version that is in
      # the registry.
      - name: Create and push the SDK's release tag
        run: |
          tag="transport-sdk-v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin, skipping tag creation."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi
