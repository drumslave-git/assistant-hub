name: Release

# Ships new images whenever the "version" field in the ROOT package.json changes
# on main. Bump the version locally (e.g. `npm run release:patch`) and push to
# main; this workflow verifies, tags the release, and pushes EVERY per-app image
# (one per entry in the release job's matrix) to the org's GitHub Container
# Registry (ghcr.io/<owner>/<image>) on that one version. Auth is the job's own
# GITHUB_TOKEN — no registry secrets to keep.
# No version change -> nothing runs. Manual dispatch (Actions -> Release ->
# Run workflow) forces a release of the CURRENT version - for re-runs and for
# proving the pipeline on a fresh repo; tagging and image pushes are idempotent.
on:
  push:
    branches: [main]
    # Only wake the workflow when package.json is touched; the version job then
    # confirms the "version" field actually changed before anything ships.
    paths:
      - "package.json"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Need the previous commit to diff the version field.
          fetch-depth: 2

      - id: check
        name: Compare package.json version against previous commit
        run: |
          current=$(node -p "require('./package.json').version")
          echo "version=$current" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch -> releasing current version $current."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git cat-file -e HEAD~1:package.json 2>/dev/null; then
            previous=$(git show HEAD~1:package.json \
              | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          else
            previous=""
          fi
          echo "previous='$previous' current='$current'"
          if [ "$current" != "$previous" ]; then
            echo "Version changed -> release will run."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged -> nothing to release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Lint, typecheck, test
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # `npm install`, not `npm ci`: package-lock.json is generated on Windows and
      # omits Linux-only optional native deps (@emnapi/*, sharp/lightningcss musl
      # builds), which `npm ci`'s strict sync check rejects. Mirrors the Dockerfile.
      - run: npm install --no-audit --no-fund
      # Root scripts fan out across every workspace via turbo.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # A release is all-or-nothing: every image is built first (nothing pushed),
  # and only when EVERY build succeeded does one job push them all and tag the
  # commit. One failing image fails the whole release with the registry and the
  # repo untouched - no half-released version, no dangling tag.
  build:
    name: Build ${{ matrix.image }}
    needs: [version, verify]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Per-app images, all released together on the same version. Every app
      # that ships an image adds a matrix entry here - the publish job picks
      # up whatever this matrix produced.
      matrix:
        include:
          - image: ahw-core
            dockerfile: apps/core/Dockerfile
          - image: ahw-tg
            dockerfile: apps/tg/Dockerfile
      # Let the other image finish (and warm its cache) even if one fails; the
      # publish job still refuses to run unless all of them succeeded.
      fail-fast: false
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Not pushed: exported as a tarball for the publish job.
          outputs: type=docker,dest=/tmp/${{ matrix.image }}.tar
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          # Reuse layers across runs to keep rebuilds fast; scoped per image so
          # the two builds do not evict each other's layers.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.image }}
          path: /tmp/${{ matrix.image }}.tar
          # Only a hand-off to the publish job below; nothing keeps it after.
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish all images and tag
    needs: [version, build]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Required so the workflow can push the release tag back to the repo.
      contents: write
      # Required to push images to the org's container registry.
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true

      - name: Load images
        run: |
          set -eu
          for tar in /tmp/images/*.tar; do
            docker load --input "$tar"
          done
          docker image ls --format '{{.Repository}}:{{.Tag}}'

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every image's version tag goes up before any `latest` moves, so a push
      # failure mid-way can never leave `latest` pointing at a mixed set.
      - name: Push version tags
        run: |
          set -eu
          for ref in $(docker image ls --format '{{.Repository}}:{{.Tag}}' --filter "reference=${REGISTRY}/*:${VERSION}"); do
            docker push "$ref"
          done

      - name: Push latest tags
        run: |
          set -eu
          for ref in $(docker image ls --format '{{.Repository}}:{{.Tag}}' --filter "reference=${REGISTRY}/*:${VERSION}"); do
            latest="${ref%:*}:latest"
            docker tag "$ref" "$latest"
            docker push "$latest"
          done

      # The git tag is the last step: it exists only for a version whose every
      # image is already in the registry.
      - name: Create and push release tag
        run: |
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin, skipping tag creation."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi
