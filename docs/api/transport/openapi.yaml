openapi: 3.1.0
info:
  title: assistant-hub transport HTTP contract
  version: contract-major-2
  description: |-
    The HTTP that crosses the boundary between an assistant-hub core and a transport,
    in both directions. Two servers are described:

    - **A transport's own surface** (`/health`, `/internal/*`, `/mcp`) — what the core
      calls on you. Implement it.
    - **The core's transport API** (`/api/internal/transports/*`) — what you call on the
      core: registration, desired state, the callback answer, the mirror lookup and the
      config write-back.

    Everything else is asynchronous, over Redis: see `events.schema.json`.

    GENERATED from the zod schemas of `@assistant-hub-swarm/transport-sdk` — do not edit
    by hand; run `npm run wire:generate -w @assistant-hub-swarm/transport-sdk`.
    The manual is at https://github.com/assistant-hub-swarm/ahw-core/blob/main/docs/development/adding-a-transport.md.
servers:
  - url: http://transport:3220
    description: A transport, at the base URL it announced (SELF_URL).
  - url: http://core:3200
    description: The core (CORE_API_URL).
tags:
  - name: transport
    description: Served BY a transport, called by the core. Authenticated by the shared `INTERNAL_API_TOKEN` in the `x-internal-token` header — the same secret in both directions.
  - name: core
    description: Served BY the core, called by a transport. Authenticated by the shared `INTERNAL_API_TOKEN` in the `x-internal-token` header — the same secret in both directions.
security:
  - internalToken: []
paths:
  /health:
    get:
      tags:
        - transport
      summary: Is the transport up, and what is running
      description: "The one open route: it carries no secrets and the core probes it unauthenticated, with a 5 s timeout. Answer from the first moment of boot — before registering — so a starting transport shows as starting rather than as absent."
      security: []
      responses:
        "200":
          description: Per-connection state, as the dashboard shows it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /internal/chats/{chatId}/messages:
    parameters:
      - name: chatId
        in: path
        required: true
        description: The conversation's source-local id, verbatim.
        schema:
          type: string
    post:
      tags:
        - transport
      summary: Send a message and answer with its id
      description: "The sends that need the delivered id back: a silent browsing acknowledgement (registered for later deletion) and a self-link confirmation. Ordinary replies arrive as `reply.delivery` on the bus instead. Report this send as `message.delivered` like any other."
      parameters:
        - name: assistantId
          in: query
          required: false
          description: "Whose connection performs the send. Absent: whichever connection runs."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalSendMessageRequest"
      responses:
        "200":
          description: The delivered message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalSentMessageResponse"
        "400":
          description: The body or a parameter did not match the schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "401":
          description: Missing or wrong internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "502":
          description: The platform refused the action. The body carries the platform's own words, which the core relays to whoever asked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /internal/chats/{chatId}/messages/{messageId}:
    parameters:
      - name: chatId
        in: path
        required: true
        description: The conversation's source-local id, verbatim.
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        description: The message's source-local id, verbatim.
        schema:
          type: string
    delete:
      tags:
        - transport
      summary: Delete one of the assistant's own messages
      description: "Removing a stale acknowledgement or menu. A platform that refuses (Telegram will not delete messages older than 48 h) answers `deleted: false` — never an error, because the message simply staying is cosmetic for every caller."
      responses:
        "200":
          description: Whether the platform performed it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalDeleteMessageResponse"
        "400":
          description: The body or a parameter did not match the schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "401":
          description: Missing or wrong internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /internal/chats/{chatId}/voice:
    parameters:
      - name: chatId
        in: path
        required: true
        description: The conversation's source-local id, verbatim.
        schema:
          type: string
    post:
      tags:
        - transport
      summary: Deliver a reply as a voice message
      description: "The speech is synthesized in the core; the bytes cross here. Fall back to a text send of `text` when the platform refuses the voice form, and say so with `asVoice: false` — the core mirrors the words either way."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalSendVoiceRequest"
      responses:
        "200":
          description: What was actually delivered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalSentVoiceResponse"
        "400":
          description: The body or a parameter did not match the schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "401":
          description: Missing or wrong internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "502":
          description: The platform refused the action. The body carries the platform's own words, which the core relays to whoever asked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /internal/chats/{chatId}/photos:
    parameters:
      - name: chatId
        in: path
        required: true
        description: The conversation's source-local id, verbatim.
        schema:
          type: string
    post:
      tags:
        - transport
      summary: Deliver generated images
      description: Images a tool drew during the turn, delivered after the reply. Report each with `message.delivered` carrying its media, so the core's describer reads what the assistant itself put in the chat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalSendPhotosRequest"
      responses:
        "200":
          description: One entry per image, in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalSentPhotosResponse"
        "400":
          description: The body or a parameter did not match the schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "401":
          description: Missing or wrong internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "502":
          description: The platform refused the action. The body carries the platform's own words, which the core relays to whoever asked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /internal/chats/{chatId}/files:
    parameters:
      - name: chatId
        in: path
        required: true
        description: The conversation's source-local id, verbatim.
        schema:
          type: string
    post:
      tags:
        - transport
      summary: Deliver a file
      description: A browser-agent download. Pick the playable send kind by mime where the platform has one, and retry as a plain attachment when it refuses the container. The core allows 500 s for this call, because the upload is the platform's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalSendFileRequest"
      responses:
        "200":
          description: The delivered file message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalSentFileResponse"
        "400":
          description: The body or a parameter did not match the schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "401":
          description: Missing or wrong internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "502":
          description: The platform refused the action. The body carries the platform's own words, which the core relays to whoever asked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /internal/chats/{chatId}/menu:
    parameters:
      - name: chatId
        in: path
        required: true
        description: The conversation's source-local id, verbatim.
        schema:
          type: string
    post:
      tags:
        - transport
      summary: Post a button menu
      description: The feedback flow's options menu. The grid is plain data; render it however the platform allows. A platform with no buttons never receives this call, because it never publishes `transport.reaction` — the contract carries no capability flags.
      parameters:
        - name: assistantId
          in: query
          required: false
          description: "Whose connection performs the send. Absent: whichever connection runs."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalSendMenuRequest"
      responses:
        "200":
          description: The posted menu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalSentMenuResponse"
        "400":
          description: The body or a parameter did not match the schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "401":
          description: Missing or wrong internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "502":
          description: The platform refused the action. The body carries the platform's own words, which the core relays to whoever asked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /internal/chats/{chatId}/menu/{messageId}:
    parameters:
      - name: chatId
        in: path
        required: true
        description: The conversation's source-local id, verbatim.
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        description: The message's source-local id, verbatim.
        schema:
          type: string
    patch:
      tags:
        - transport
      summary: Rewrite a posted menu
      description: "`keyboard: null` removes the buttons and leaves the text."
      parameters:
        - name: assistantId
          in: query
          required: false
          description: "Whose connection performs the send. Absent: whichever connection runs."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalEditMenuRequest"
      responses:
        "200":
          description: Acknowledged.
        "400":
          description: The body or a parameter did not match the schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "401":
          description: Missing or wrong internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "502":
          description: The platform refused the action. The body carries the platform's own words, which the core relays to whoever asked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
    delete:
      tags:
        - transport
      summary: Remove a posted menu
      parameters:
        - name: assistantId
          in: query
          required: false
          description: "Whose connection performs the send. Absent: whichever connection runs."
          schema:
            type: string
      responses:
        "200":
          description: Whether the platform performed it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalDeleteMessageResponse"
        "400":
          description: The body or a parameter did not match the schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "401":
          description: Missing or wrong internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /internal/chats/{chatId}/title:
    parameters:
      - name: chatId
        in: path
        required: true
        description: The conversation's source-local id, verbatim.
        schema:
          type: string
    put:
      tags:
        - transport
      summary: Name a conversation
      description: Only for platforms whose conversations arrive unnamed, which is what `chatInfo.titleProvisional` says. A platform whose chats have real names of their own does not serve this route at all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalSetTitleRequest"
      responses:
        "200":
          description: The title it now carries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalSetTitleResponse"
        "400":
          description: The body or a parameter did not match the schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "401":
          description: Missing or wrong internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "502":
          description: The platform refused the action. The body carries the platform's own words, which the core relays to whoever asked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /mcp:
    post:
      tags:
        - transport
      summary: The transport's own MCP server
      description: "MCP over Streamable HTTP, at the `mcpPath` announced at registration. Stateless: one server per request, no session ids — every call carries its whole turn in `_meta` (see `TurnToolMeta`), so nothing is worth keeping alive between calls and nothing needs reconciling after a restart. The core provisions the tool connection itself; the tools reach the model as `<source>__<tool>`, on this platform's turns only."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: A JSON-RPC message of the Model Context Protocol.
      responses:
        "200":
          description: A JSON-RPC response, or an SSE stream.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        "400":
          description: The body or a parameter did not match the schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "401":
          description: Missing or wrong internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /api/internal/transports/register:
    post:
      tags:
        - core
      summary: Register, and receive the desired state
      description: "A transport announces itself at boot; the answer IS its desired state, so registration doubles as the first fetch. Retry until the core answers — it may boot second. The id is accepted on shape alone: there is no list in the core to extend. Re-registering is how a transport reports a new build; the operator's `enabled` flag and stored config blobs survive it."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransportRegistrationRequest"
      responses:
        "200":
          description: The desired state to reconcile against.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportDesiredState"
        "400":
          description: The body or a parameter did not match the schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "401":
          description: Missing or wrong internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "409":
          description: The announced `contractMajor` is not the one this core speaks. The message names both. The registration row is kept so the dashboard shows the refusal next to the transport's name; no desired state is given, and its events are dropped at ingest until one side is updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /api/internal/transports/{id}/desired:
    parameters:
      - name: id
        in: path
        required: true
        description: The transport's own id.
        schema:
          $ref: "#/components/schemas/SourceId"
    get:
      tags:
        - core
      summary: Refetch the desired state
      description: Called on every `transport.config.changed` (and `assistant.deleted`) for this transport. A connection's `enabled` already folds in the transport-level switch and the owning account's deactivation, so reconciling to this answer is the whole decision.
      responses:
        "200":
          description: The desired state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportDesiredState"
        "400":
          description: The body or a parameter did not match the schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "401":
          description: Missing or wrong internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "404":
          description: No transport with that id is registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /api/internal/transports/{id}/config:
    parameters:
      - name: id
        in: path
        required: true
        description: The transport's own id.
        schema:
          $ref: "#/components/schemas/SourceId"
    patch:
      tags:
        - core
      summary: Write back into the transport-level config
      description: For something the transport resolved and wants kept across restarts. Shallow merge; the keys are the transport's own and the core never reads inside them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigBlob"
      responses:
        "200":
          description: The transport-level blob after the merge.
          content:
            application/json:
              schema:
                type: object
                required:
                  - config
                properties:
                  config:
                    $ref: "#/components/schemas/ConfigBlob"
        "400":
          description: The body or a parameter did not match the schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "401":
          description: Missing or wrong internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "404":
          description: No transport with that id is registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /api/internal/transports/messages:
    get:
      tags:
        - core
      summary: Ask the mirror about one message
      description: "What a reaction tool checks before touching the platform: does the target exist, and is it the assistant's own? A guessed id is then refused without a platform call. `assistantId` with `direct=true` picks that assistant's direct stream; a group chat is one shared stream."
      parameters:
        - name: source
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/SourceId"
        - name: chatId
          in: query
          required: true
          schema:
            type: string
        - name: sourceMessageId
          in: query
          required: true
          schema:
            type: string
        - name: assistantId
          in: query
          required: false
          schema:
            type: string
        - name: direct
          in: query
          required: false
          description: Literal `true` selects the assistant's own direct stream.
          schema:
            type: string
            enum:
              - "true"
              - "false"
      responses:
        "200":
          description: What the mirror holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportMessageLookupResponse"
        "400":
          description: The body or a parameter did not match the schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "401":
          description: Missing or wrong internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
  /api/internal/transports/callback:
    post:
      tags:
        - core
      summary: A feedback-menu button was pressed
      description: "The one update that is request/response rather than a queue event: the platform's button spinner wants a toast only the flow's outcome can word. Never a 5xx — a platform with no feedback flow, or a flow that failed, gets `toast: null`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransportCallbackRequest"
      responses:
        "200":
          description: The toast to answer with, or null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportCallbackResponse"
        "400":
          description: The body or a parameter did not match the schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        "401":
          description: Missing or wrong internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
components:
  securitySchemes:
    internalToken:
      type: apiKey
      in: header
      name: x-internal-token
      description: Authenticated by the shared `INTERNAL_API_TOKEN` in the `x-internal-token` header — the same secret in both directions.
  schemas:
    InternalError:
      title: InternalError
      description: "The reduced error shape of both internal surfaces: a message, no envelope."
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
          properties:
            message:
              type: string
    ConfigBlob:
      title: ConfigBlob
      description: An opaque JSON object of a transport's own keys. The core stores and hands it back; it never reads inside.
      type: object
      additionalProperties: true
    HealthResponse:
      title: HealthResponse
      description: What a transport answers on /health — probed unauthenticated by the core on every assistant-editor read and by the Overview status card.
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        connections:
          type: array
          items:
            type: object
            required:
              - connectionId
              - state
            properties:
              connectionId:
                type: string
              assistantId:
                type:
                  - string
                  - "null"
              state:
                type: string
                description: "`starting` | `running` | `stopped` | `error` — what the dashboard shows."
              username:
                type:
                  - string
                  - "null"
              since:
                type:
                  - string
                  - "null"
                format: date-time
              error:
                type:
                  - string
                  - "null"
    AssistantDeletedEvent:
      title: AssistantDeletedEvent
      description: An assistant is gone; stop anything running for it.
      type: object
      properties:
        v:
          type: number
          const: 1
        eventId:
          type: string
          minLength: 1
        occurredAt:
          type: string
          minLength: 1
        correlationId:
          type: string
          minLength: 1
        type:
          type: string
          const: assistant.deleted
        assistantId:
          type: string
          minLength: 1
      required:
        - v
        - eventId
        - occurredAt
        - correlationId
        - type
        - assistantId
      additionalProperties: false
    ChatInfo:
      title: ChatInfo
      description: A conversation as the pipeline reads it, named by scoped ref.
      type: object
      properties:
        ref:
          type: string
        kind:
          type: string
          enum:
            - direct
            - group
        title:
          anyOf:
            - type: string
            - type: "null"
        type:
          anyOf:
            - type: string
            - type: "null"
        notes:
          anyOf:
            - type: string
            - type: "null"
        language:
          anyOf:
            - type: string
            - type: "null"
        titleProvisional:
          type: boolean
      required:
        - ref
        - kind
      additionalProperties: false
    ConnectionIdentity:
      title: ConnectionIdentity
      description: Who a transport's connection is on its platform, as it reports back on every event.
      type: object
      properties:
        botUsername:
          type: string
          minLength: 1
        botDisplayName:
          type: string
          minLength: 1
      required:
        - botUsername
        - botDisplayName
      additionalProperties: false
    ConversationContext:
      title: ConversationContext
      description: The history window and participants the core composed for a turn.
      type: object
      properties:
        history:
          type: array
          items:
            type: object
            properties:
              sourceMessageId:
                type: string
                minLength: 1
              role:
                type: string
                enum:
                  - user
                  - assistant
              assistantId:
                anyOf:
                  - type: string
                  - type: "null"
              senderRef:
                anyOf:
                  - type: string
                  - type: "null"
              senderLabel:
                anyOf:
                  - type: string
                  - type: "null"
              content:
                type: string
              sentAt:
                type: string
                minLength: 1
              replyToSourceMessageId:
                anyOf:
                  - type: string
                  - type: "null"
              botReaction:
                anyOf:
                  - type: string
                  - type: "null"
              mediaNote:
                anyOf:
                  - type: string
                  - type: "null"
            required:
              - sourceMessageId
              - role
              - senderRef
              - senderLabel
              - content
              - sentAt
            additionalProperties: false
        participants:
          type: array
          items:
            type: object
            properties:
              ref:
                type: string
              label:
                type: string
                minLength: 1
              username:
                anyOf:
                  - type: string
                  - type: "null"
              aliases:
                default: []
                type: array
                items:
                  type: string
